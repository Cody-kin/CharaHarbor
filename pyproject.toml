[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-companion-core"
version = "0.5.1"
requires-python = ">=3.9"
description = "Private-by-default configurable companion core; experimental WeChat adapter"

[tool.setuptools.packages.find]
include = ["companion*"]
